[package]
name = "dota2coach"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
coach = { version = "0.1.0", path = "../coach" }
gsi = { version = "0.1.0", path = "../gsi" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
voice = { version = "0.1.0", path = "../voice" }

[dev-dependencies]
toml = "1.1.8"
