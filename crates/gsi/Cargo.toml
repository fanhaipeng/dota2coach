[package]
name = "gsi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time", "fs", "io-util", "net"] }
tracing = "0.1.44"
