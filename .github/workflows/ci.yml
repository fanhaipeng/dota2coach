name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Platform-specific code (speech, later screen capture) is only compiled
      # on its own OS, so lint and test on every OS.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release -p dota2coach
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "target/release/dota2coach$ext" dist/
          cp -r rules dist/
          cp README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dota2coach-${{ runner.os }}-${{ runner.arch }}
          path: dist/

  # Pushing a tag such as v0.1.0 publishes a GitHub Release with a zip per OS,
  # which is what players download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip each build
        run: |
          mkdir release
          for dir in artifacts/dota2coach-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "../../release/$name.zip" .)
          done
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
