# Shared English messages. Every other language falls back to these, so every
# message key a rule uses should exist here. See rules/README.md.

low_hp = "Low health. Back off."
no_tp = "You have no TP scroll."

[_meta]
name = "English"
voice = "en-US"
list_separator = ", "
list_last = " and "

[buyback]
