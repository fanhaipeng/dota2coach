gpm_behind = "Your farm is behind at {gpm} gold per minute. Find safer farm."

[support]
wards = "You have no wards. Pick some up and keep vision."

# Post-game review (dota2coach review).
[review]
title = "Match {match} · {hero} · {role} · {duration} · {result}"
won = "won"
lost = "lost"
result_unknown = "result unknown"
role_unknown = "role unknown"
final = "Final: level {level}, {kills}/{deaths}/{assists}, {last_hits} last hits, {gpm} GPM"
farm_header = "Farm"
farm_row = "  {time}  {last_hits} last hits, {gpm} GPM{target}"
farm_target = " (target {target})"
deaths_header = "Deaths: {count}"
no_deaths = "  No deaths."
death_row = "  {time}  {place}, lost {lost} gold (carried {carried}){tp}{warned}"
lane_safe = "in your safe lane"
lane_mid = "in mid"
lane_off = "in the offlane"
lane_none = "in the jungle, river or a base"
no_tp = ", no TP"
warned = ". Warned: {advice}"
items_header = "Items"
item_row = "  {time}  {item}"
gold_header = "Unspent gold"
gold_ok = "  Never carried more than {gold} gold for long."
gold_banked = "  Carried more than {gold} gold for {total} in total, the longest stretch {longest} from {from}."
advice_header = "The coach said {count} things. Most often:"
advice_row = "  {count}×  {text}"
coach_header = "Coach's review"
coach_mistakes = "Costliest mistakes"
coach_well_done = "Done well"
coach_focus = "Focus next game"

[screen]
push = "{count} enemies dead for {secs} seconds. Push a tower."
roshan = "{count} enemies dead for {secs} seconds. Take Roshan or high ground."
allies_dead = "{count} teammates dead. Play safe, don't fight alone."
gank = "Enemies near you and no teammates around. Back off or get help."
missing = "{count} enemies just vanished from the map. Watch for a gank."
check_items = "Click their {hero} on the top bar to check the items."

# Roshan's respawn, from his skull on the minimap (universal/roshan.rhai).
[roshan]
killed = "Roshan is down. He's back between {earliest} and {latest}."
soon = "Roshan can respawn in 1 minute, from {earliest}. Get vision on his pit."
window = "Roshan can be back now. He is back by {latest} at the latest."
last = "Roshan is back within 1 minute, by {latest}."

